<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caisse — L'Attrape-Rêves</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0eb;
      color: #2c2c2c;
      min-height: 100vh;
    }
    header {
      background: #3d2b1f;
      color: #f5e6d3;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .role-badge {
      font-size: 12px;
      background: rgba(255,255,255,0.15);
      padding: 3px 10px;
      border-radius: 20px;
    }
    #logout-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: #f5e6d3;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    /* LOGIN */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-card .logo { font-size: 36px; margin-bottom: 12px; }
    .login-card h2 { font-size: 20px; color: #3d2b1f; margin-bottom: 24px; }
    .login-card input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0d5c8;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus { border-color: #a0785a; }
    .login-card button {
      width: 100%;
      padding: 13px;
      background: #3d2b1f;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-card button:hover { background: #5a3f2e; }
    .login-error { color: #c0392b; font-size: 14px; margin-top: 10px; display: none; }

    /* MAIN APP */
    #app { display: none; }
    .tabs {
      display: flex;
      background: white;
      border-bottom: 2px solid #e0d5c8;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 13px 10px;
      background: none;
      border: none;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active { color: #3d2b1f; border-bottom-color: #a0785a; font-weight: 600; }
    .tab-content { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content.active { display: block; }

    /* CARDS */
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h3 { font-size: 15px; color: #3d2b1f; margin-bottom: 14px; }

    /* FORM ELEMENTS */
    .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .form-row > * { flex: 1; }
    label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
    select, input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0d5c8;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: white;
    }
    select:focus, input:focus, textarea:focus { border-color: #a0785a; }
    textarea { resize: vertical; min-height: 60px; }

    /* COUPURES */
    .coupures-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .coupure-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f9f6f2;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .coupure-label {
      font-size: 13px;
      color: #555;
      min-width: 52px;
      font-weight: 500;
    }
    .coupure-item input {
      width: 60px;
      padding: 6px 8px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }
    .coupure-subtotal {
      font-size: 12px;
      color: #a0785a;
      min-width: 50px;
      text-align: right;
    }

    .total-display {
      background: #3d2b1f;
      color: white;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .total-display span:first-child { font-size: 14px; opacity: 0.8; }
    .total-display .total-amount { font-size: 22px; font-weight: 700; }

    .section-sep {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      margin: 10px 0 6px;
    }

    /* BUTTONS */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
      font-weight: 500;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #3d2b1f; color: white; width: 100%; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-success { background: #27ae60; color: white; }
    .btn-outline {
      background: none;
      border: 2px solid #e0d5c8;
      color: #3d2b1f;
    }
    .btn-small { padding: 6px 12px; font-size: 13px; }

    /* HISTORIQUE */
    .entry-card {
      background: white;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .entry-caisse {
      display: inline-block;
      background: #f0e8df;
      color: #3d2b1f;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .entry-total { font-size: 18px; font-weight: 700; color: #3d2b1f; }
    .entry-date { font-size: 12px; color: #999; margin-top: 2px; }
    .entry-note { font-size: 13px; color: #666; margin-top: 6px; font-style: italic; }
    .entry-actions { display: flex; gap: 6px; margin-top: 8px; }

    /* RETRAITS */
    .retrait-card {
      background: white;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border-left: 4px solid #e0d5c8;
    }
    .retrait-card.depose { border-left-color: #27ae60; }
    .retrait-montant { font-size: 20px; font-weight: 700; color: #c0392b; }
    .retrait-montant.depose { color: #27ae60; }
    .badge-depose {
      display: inline-block;
      background: #d5f0e0;
      color: #27ae60;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-attente {
      display: inline-block;
      background: #fef3cd;
      color: #856404;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* TOTAUX */
    .totaux-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .total-box {
      background: #f9f6f2;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .total-box .box-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .total-box .box-value { font-size: 20px; font-weight: 700; color: #3d2b1f; }
    .total-box .box-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

    .empty-state { text-align: center; color: #aaa; padding: 30px 20px; font-size: 14px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #3d2b1f;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      transition: transform 0.3s;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="logo">💰</div>
    <h2>Gestion des caisses</h2>
    <input type="password" id="login-pwd" placeholder="Mot de passe" autocomplete="current-password" />
    <button onclick="doLogin()">Connexion</button>
    <div class="login-error" id="login-error">Mot de passe incorrect</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>💰 Caisses</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="role-badge" id="role-badge"></span>
      <button id="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="tabs" id="tabs-nav">
    <button class="tab-btn active" onclick="showTab('comptage')">Comptage</button>
    <button class="tab-btn" onclick="showTab('historique')">Historique</button>
    <button class="tab-btn owner-only" onclick="showTab('retraits')" style="display:none">Retraits</button>
    <button class="tab-btn owner-only" onclick="showTab('totaux')" style="display:none">Totaux</button>
  </div>

  <!-- TAB COMPTAGE -->
  <div class="tab-content active" id="tab-comptage">
    <div class="card">
      <h3>Nouveau comptage</h3>
      <div class="form-row">
        <div>
          <label>Caisse</label>
          <select id="c-caisse">
            <option value="A">Roulotte</option>
            <option value="B">Buvette / Boutique</option>
          </select>
        </div>
        <div>
          <label>Date</label>
          <input type="date" id="c-date" />
        </div>
        <div>
          <label>Heure</label>
          <input type="time" id="c-heure" />
        </div>
      </div>

      <div class="section-sep">Billets</div>
      <div class="coupures-grid" id="billets-grid"></div>

      <div class="section-sep">Pièces</div>
      <div class="coupures-grid" id="pieces-grid"></div>

      <div class="total-display">
        <span>Total comptage</span>
        <span class="total-amount" id="total-live">0,00 €</span>
      </div>

      <div style="margin-bottom:12px;">
        <label>Note (optionnel)</label>
        <textarea id="c-note" placeholder="Ex : fin de journée, caisse A…"></textarea>
      </div>

      <button class="btn btn-primary" onclick="submitComptage()">Enregistrer le comptage</button>
    </div>
  </div>

  <!-- TAB HISTORIQUE -->
  <div class="tab-content" id="tab-historique">
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-outline btn-small" onclick="loadHistorique()" style="flex:1">Toutes</button>
      <button class="btn btn-outline btn-small" onclick="loadHistorique('A')" style="flex:1">Caisse A</button>
      <button class="btn btn-outline btn-small" onclick="loadHistorique('B')" style="flex:1">Caisse B</button>
    </div>
    <div id="historique-list"><div class="empty-state">Chargement…</div></div>
  </div>

  <!-- TAB RETRAITS (owner) -->
  <div class="tab-content" id="tab-retraits">
    <div class="card">
      <h3>Enregistrer un retrait</h3>
      <div class="form-row">
        <div>
          <label>Caisse</label>
          <select id="r-caisse">
            <option value="A">Roulotte</option>
            <option value="B">Buvette / Boutique</option>
          </select>
        </div>
        <div>
          <label>Montant (€)</label>
          <input type="number" id="r-montant" placeholder="0,00" step="0.01" min="0" />
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <label>Note (optionnel)</label>
        <textarea id="r-note" placeholder="Ex : dépôt banque du lundi…"></textarea>
      </div>
      <button class="btn btn-primary" onclick="submitRetrait()">Enregistrer le retrait</button>
    </div>

    <div id="retraits-list"><div class="empty-state">Chargement…</div></div>
  </div>

  <!-- TAB TOTAUX (owner) -->
  <div class="tab-content" id="tab-totaux">
    <div class="card">
      <h3>Vue d'ensemble</h3>
      <div class="totaux-grid" id="totaux-grid">
        <div class="empty-state" style="grid-column:span 2">Chargement…</div>
      </div>
    </div>
    <div class="card" id="totaux-detail">
      <h3>Derniers comptages</h3>
      <div id="totaux-recent"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = ''
let TOKEN = ''
let ROLE = '' // 'staff' | 'owner'

const BILLETS = [
  { key: 'billet_500', label: '500 €', val: 50000 },
  { key: 'billet_200', label: '200 €', val: 20000 },
  { key: 'billet_100', label: '100 €', val: 10000 },
  { key: 'billet_50',  label: '50 €',  val: 5000 },
  { key: 'billet_20',  label: '20 €',  val: 2000 },
  { key: 'billet_10',  label: '10 €',  val: 1000 },
  { key: 'billet_5',   label: '5 €',   val: 500 },
]
const PIECES = [
  { key: 'piece_200', label: '2 €',    val: 200 },
  { key: 'piece_100', label: '1 €',    val: 100 },
  { key: 'piece_050', label: '0,50 €', val: 50 },
  { key: 'piece_020', label: '0,20 €', val: 20 },
  { key: 'piece_010', label: '0,10 €', val: 10 },
  { key: 'piece_005', label: '0,05 €', val: 5 },
  { key: 'piece_002', label: '0,02 €', val: 2 },
  { key: 'piece_001', label: '0,01 €', val: 1 },
]

function fmtEuros(centimes) {
  return (centimes / 100).toFixed(2).replace('.', ',') + ' €'
}
function fmtCaisse(c) {
  return c === 'A' ? 'Roulotte' : 'Buvette / Boutique'
}
function fmtDate(str) {
  if (!str) return ''
  // str peut être "2026-06-30" ou datetime ISO
  const d = str.substring(0, 10).split('-')
  return `${d[2]}/${d[1]}/${d[0]}`
}

// ---- AUTH ----
async function doLogin() {
  const pwd = document.getElementById('login-pwd').value
  const err = document.getElementById('login-error')
  err.style.display = 'none'
  try {
    const res = await fetch(`${API}/api/caisse/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    })
    const data = await res.json()
    if (!res.ok) { err.style.display = 'block'; return }
    TOKEN = data.token
    ROLE = data.role
    localStorage.setItem('caisse_token', TOKEN)
    localStorage.setItem('caisse_role', ROLE)
    startApp()
  } catch { err.style.display = 'block' }
}

function logout() {
  TOKEN = ''; ROLE = ''
  localStorage.removeItem('caisse_token')
  localStorage.removeItem('caisse_role')
  document.getElementById('app').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('login-pwd').value = ''
}

document.getElementById('login-pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin()
})

// ---- INIT APP ----
function startApp() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  document.getElementById('role-badge').textContent = ROLE === 'owner' ? 'Propriétaire' : 'Staff'

  // Onglets owner
  document.querySelectorAll('.owner-only').forEach(el => {
    el.style.display = ROLE === 'owner' ? '' : 'none'
  })

  buildCoupuresGrid()
  initDateHeure()
  loadHistorique()
  if (ROLE === 'owner') {
    loadRetraits()
    loadTotaux()
  }
}

// Restaurer session
window.addEventListener('DOMContentLoaded', () => {
  const t = localStorage.getItem('caisse_token')
  const r = localStorage.getItem('caisse_role')
  if (t && r) { TOKEN = t; ROLE = r; startApp() }
})

// ---- COUPURES GRID ----
function buildCoupuresGrid() {
  const billetGrid = document.getElementById('billets-grid')
  const pieceGrid = document.getElementById('pieces-grid')
  billetGrid.innerHTML = ''
  pieceGrid.innerHTML = ''
  ;[...BILLETS, ...PIECES].forEach(c => {
    const grid = c.key.startsWith('billet') ? billetGrid : pieceGrid
    const div = document.createElement('div')
    div.className = 'coupure-item'
    div.innerHTML = `
      <span class="coupure-label">${c.label}</span>
      <input type="number" id="${c.key}" value="0" min="0" step="1"
        oninput="updateTotal()" onfocus="this.select()" />
      <span class="coupure-subtotal" id="sub_${c.key}">0,00 €</span>
    `
    grid.appendChild(div)
  })
}

function updateTotal() {
  let total = 0
  for (const c of [...BILLETS, ...PIECES]) {
    const n = parseInt(document.getElementById(c.key)?.value) || 0
    const sub = n * c.val
    total += sub
    const el = document.getElementById(`sub_${c.key}`)
    if (el) el.textContent = fmtEuros(sub)
  }
  document.getElementById('total-live').textContent = fmtEuros(total)
}

function initDateHeure() {
  const now = new Date()
  const pad = n => String(n).padStart(2, '0')
  document.getElementById('c-date').value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`
  document.getElementById('c-heure').value =
    `${pad(now.getHours())}:${pad(now.getMinutes())}`
}

// ---- TAB NAV ----
function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'))
  document.getElementById('tab-' + name).classList.add('active')
  event.target.classList.add('active')
}

// ---- TOAST ----
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}

// ---- API HELPERS ----
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' }
  }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(`${API}${path}`, opts)
  return res
}

// ---- COMPTAGE ----
async function submitComptage() {
  const payload = {
    caisse: document.getElementById('c-caisse').value,
    comptage_date: document.getElementById('c-date').value,
    comptage_heure: document.getElementById('c-heure').value,
    note: document.getElementById('c-note').value.trim() || null
  }
  for (const c of [...BILLETS, ...PIECES]) {
    payload[c.key] = parseInt(document.getElementById(c.key).value) || 0
  }
  const res = await api('POST', '/api/caisse/comptages', payload)
  if (res.ok) {
    toast('Comptage enregistré ✓')
    // Reset
    for (const c of [...BILLETS, ...PIECES]) {
      document.getElementById(c.key).value = 0
      document.getElementById(`sub_${c.key}`).textContent = '0,00 €'
    }
    document.getElementById('total-live').textContent = '0,00 €'
    document.getElementById('c-note').value = ''
    initDateHeure()
    loadHistorique()
    if (ROLE === 'owner') loadTotaux()
  } else {
    toast('Erreur lors de l\'enregistrement')
  }
}

// ---- HISTORIQUE ----
async function loadHistorique(caisse) {
  const url = caisse ? `/api/caisse/comptages?caisse=${caisse}` : '/api/caisse/comptages'
  const res = await api('GET', url)
  const data = await res.json()
  const list = document.getElementById('historique-list')
  if (!data.length) { list.innerHTML = '<div class="empty-state">Aucun comptage enregistré</div>'; return }
  list.innerHTML = data.map(c => `
    <div class="entry-card">
      <div class="entry-header">
        <div>
          <span class="entry-caisse">${fmtCaisse(c.caisse)}</span>
          <div class="entry-date">${fmtDate(c.comptage_date)} à ${c.comptage_heure}</div>
        </div>
        <span class="entry-total">${fmtEuros(c.total_centimes)}</span>
      </div>
      ${c.note ? `<div class="entry-note">${escHtml(c.note)}</div>` : ''}
      ${ROLE === 'owner' ? `
        <div class="entry-actions">
          <button class="btn btn-danger btn-small" onclick="deleteComptage(${c.id})">Supprimer</button>
        </div>` : ''}
    </div>
  `).join('')
}

async function deleteComptage(id) {
  if (!confirm('Supprimer ce comptage ?')) return
  const res = await api('DELETE', `/api/caisse/comptages/${id}`)
  if (res.ok) { toast('Comptage supprimé'); loadHistorique(); loadTotaux() }
}

// ---- RETRAITS ----
async function submitRetrait() {
  const montantEuros = parseFloat(document.getElementById('r-montant').value)
  if (!montantEuros || montantEuros <= 0) { toast('Montant invalide'); return }
  const payload = {
    caisse: document.getElementById('r-caisse').value,
    montant_centimes: Math.round(montantEuros * 100),
    note: document.getElementById('r-note').value.trim() || null
  }
  const res = await api('POST', '/api/caisse/retraits', payload)
  if (res.ok) {
    toast('Retrait enregistré ✓')
    document.getElementById('r-montant').value = ''
    document.getElementById('r-note').value = ''
    loadRetraits()
    loadTotaux()
  } else {
    toast('Erreur lors de l\'enregistrement')
  }
}

async function loadRetraits() {
  const res = await api('GET', '/api/caisse/retraits')
  const data = await res.json()
  const list = document.getElementById('retraits-list')
  if (!data.length) { list.innerHTML = '<div class="empty-state">Aucun retrait enregistré</div>'; return }
  list.innerHTML = data.map(r => `
    <div class="retrait-card ${r.depose_banque ? 'depose' : ''}">
      <div class="entry-header">
        <div>
          <span class="entry-caisse">${fmtCaisse(r.caisse)}</span>
          ${r.depose_banque
            ? `<span class="badge-depose" style="margin-left:6px">✓ Déposé banque</span>`
            : `<span class="badge-attente" style="margin-left:6px">En attente</span>`}
          <div class="entry-date">${fmtDate(r.created_at)}</div>
        </div>
        <span class="retrait-montant ${r.depose_banque ? 'depose' : ''}">−${fmtEuros(r.montant_centimes)}</span>
      </div>
      ${r.note ? `<div class="entry-note">${escHtml(r.note)}</div>` : ''}
      <div class="entry-actions">
        ${!r.depose_banque
          ? `<button class="btn btn-success btn-small" onclick="marquerDepose(${r.id})">✓ Déposé en banque</button>`
          : `<button class="btn btn-outline btn-small" onclick="annulerDepose(${r.id})">Annuler dépôt</button>`}
        <button class="btn btn-danger btn-small" onclick="deleteRetrait(${r.id})">Supprimer</button>
      </div>
    </div>
  `).join('')
}

async function marquerDepose(id) {
  const res = await api('PATCH', `/api/caisse/retraits/${id}/depose`)
  if (res.ok) { toast('Marqué comme déposé ✓'); loadRetraits(); loadTotaux() }
}

async function annulerDepose(id) {
  const res = await api('PATCH', `/api/caisse/retraits/${id}/annule-depose`)
  if (res.ok) { toast('Dépôt annulé'); loadRetraits(); loadTotaux() }
}

async function deleteRetrait(id) {
  if (!confirm('Supprimer ce retrait ?')) return
  const res = await api('DELETE', `/api/caisse/retraits/${id}`)
  if (res.ok) { toast('Retrait supprimé'); loadRetraits(); loadTotaux() }
}

// ---- TOTAUX ----
async function loadTotaux() {
  const [resC, resR] = await Promise.all([
    api('GET', '/api/caisse/comptages?limit=200'),
    api('GET', '/api/caisse/retraits')
  ])
  const comptages = await resC.json()
  const retraits = await resR.json()

  // Dernier comptage par caisse
  const dernierA = comptages.find(c => c.caisse === 'A')
  const dernierB = comptages.find(c => c.caisse === 'B')

  // Retraits en attente de dépôt
  const enAttente = retraits.filter(r => !r.depose_banque)
  const totalAttenteA = enAttente.filter(r => r.caisse === 'A').reduce((s, r) => s + r.montant_centimes, 0)
  const totalAttenteB = enAttente.filter(r => r.caisse === 'B').reduce((s, r) => s + r.montant_centimes, 0)

  document.getElementById('totaux-grid').innerHTML = `
    <div class="total-box">
      <div class="box-label">Dernier comptage Roulotte</div>
      <div class="box-value">${dernierA ? fmtEuros(dernierA.total_centimes) : '—'}</div>
      <div class="box-sub">${dernierA ? fmtDate(dernierA.comptage_date) + ' ' + dernierA.comptage_heure : 'Aucun'}</div>
    </div>
    <div class="total-box">
      <div class="box-label">Dernier comptage Buvette</div>
      <div class="box-value">${dernierB ? fmtEuros(dernierB.total_centimes) : '—'}</div>
      <div class="box-sub">${dernierB ? fmtDate(dernierB.comptage_date) + ' ' + dernierB.comptage_heure : 'Aucun'}</div>
    </div>
    <div class="total-box">
      <div class="box-label">Retraits en attente Roulotte</div>
      <div class="box-value" style="color:#c0392b">${totalAttenteA ? fmtEuros(totalAttenteA) : '—'}</div>
      <div class="box-sub">${enAttente.filter(r => r.caisse === 'A').length} retrait(s)</div>
    </div>
    <div class="total-box">
      <div class="box-label">Retraits en attente Buvette</div>
      <div class="box-value" style="color:#c0392b">${totalAttenteB ? fmtEuros(totalAttenteB) : '—'}</div>
      <div class="box-sub">${enAttente.filter(r => r.caisse === 'B').length} retrait(s)</div>
    </div>
  `

  const recent = comptages.slice(0, 6)
  document.getElementById('totaux-recent').innerHTML = recent.length
    ? recent.map(c => `
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0e8df;">
        <span><span class="entry-caisse">${fmtCaisse(c.caisse)}</span> <span style="font-size:12px;color:#999;margin-left:6px">${fmtDate(c.comptage_date)} ${c.comptage_heure}</span></span>
        <strong>${fmtEuros(c.total_centimes)}</strong>
      </div>`).join('')
    : '<div class="empty-state">Aucun comptage</div>'
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
</script>
</body>
</html>
